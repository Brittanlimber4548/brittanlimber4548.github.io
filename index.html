<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gemray-web</title>
    <!--
      No CSS/JS of this page's own beyond this reset: Slint's `renderer-femtovg`
      backend creates its own `<canvas>` and drives everything inside it. `trunk`
      rewrites the `data-trunk` link below into a `<script type="module">` that loads
      the built `.wasm`/`.js` pair and runs `gemray-web`'s `#[wasm_bindgen(start)]`
      entry point automatically -- no inline script of this crate's own is needed to
      kick it off.
    -->
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #1b1b1f;
      }
      canvas {
        display: block;
      }
    </style>
  <link rel="modulepreload" href="/gemray-web-8dc1ee672501c1b9.js" crossorigin="anonymous"><link rel="preload" href="/gemray-web-8dc1ee672501c1b9_bg.wasm" crossorigin="anonymous" as="fetch" type="application/wasm"></head>
  <body>
    
<script type="module">
import init, * as bindings from '/gemray-web-8dc1ee672501c1b9.js';
const wasm = await init({ module_or_path: '/gemray-web-8dc1ee672501c1b9_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
  </body>
</html>
